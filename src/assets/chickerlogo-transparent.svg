<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Chicken Body -->
  <ellipse cx="60" cy="75" rx="35" ry="30" fill="url(#logoGradient)" filter="url(#glow)"/>
  
  <!-- Chicken Head -->
  <circle cx="60" cy="40" r="25" fill="url(#logoGradient)" filter="url(#glow)"/>
  
  <!-- Beak -->
  <polygon points="45,40 35,45 45,50" fill="#FF8C42"/>
  
  <!-- Eyes -->
  <circle cx="52" cy="35" r="4" fill="white"/>
  <circle cx="68" cy="35" r="4" fill="white"/>
  <circle cx="52" cy="35" r="2" fill="black"/>
  <circle cx="68" cy="35" r="2" fill="black"/>
  
  <!-- Comb -->
  <path d="M50 20 Q55 15 60 20 Q65 15 70 20 Q65 25 60 22 Q55 25 50 20" fill="#FF4444"/>
  
  <!-- Wing -->
  <ellipse cx="75" cy="70" rx="15" ry="20" fill="#FF8C42" opacity="0.8"/>
  
  <!-- Tail Feathers -->
  <path d="M25 75 Q15 65 20 55 Q30 60 35 70" fill="#FF8C42" opacity="0.8"/>
  <path d="M25 80 Q10 75 15 65 Q25 70 30 80" fill="#FFD23F" opacity="0.8"/>
  
  <!-- Legs -->
  <rect x="50" y="100" width="4" height="15" fill="#FF8C42"/>
  <rect x="66" y="100" width="4" height="15" fill="#FF8C42"/>
  
  <!-- Feet -->
  <path d="M45 115 L50 115 L52 120 L48 120 L45 115" fill="#FF8C42"/>
  <path d="M66 115 L71 115 L73 120 L69 120 L66 115" fill="#FF8C42"/>
  
  <!-- Meme Elements -->
  <text x="60" y="95" text-anchor="middle" font-family="Arial Black" font-size="8" fill="white" stroke="black" stroke-width="0.5">MEME</text>
</svg>